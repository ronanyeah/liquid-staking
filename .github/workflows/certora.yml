name: Certora Prover 

on:
  push:
    branches:
      - kel/specs
      - certora
  pull_request:
  workflow_dispatch:

jobs:
  certora_run_health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install sui
        run: |
          curl -sSfL https://raw.githubusercontent.com/Mystenlabs/suiup/main/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          suiup install -y sui@1.53.2
      - name: Sui version
        run: |
          sui -V
          sui move -V
      - name: Apply patch
        run: ./certora/munges/munge.sh
      - name: Submit Jobs to Certora Prover
        uses: Certora/certora-run-action@v2
        with:
          ecosystem: sui
          working-directory: certora/spec/
          configurations: |-
            confs/accounting_integrity.conf
            confs/accounting_no_lst_no_sui.conf
            confs/accounting_total_sui_supply.conf
            confs/accounting_value_conservation.conf
            confs/integrity.conf
            confs/solvency.conf
            confs/validators_consistency.conf
          job-name: "Verify Obligation Health Rules"
          certora-key: ${{ secrets.CERTORAKEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}